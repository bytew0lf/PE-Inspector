name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name (e.g. v1.2.3)"
        required: true
      name:
        description: "Release title (optional)"
        required: false
      prerelease:
        description: "Mark as prerelease (true/false)"
        required: false
        default: "false"

jobs:
  build_test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore PE-Inspector.sln

      - name: Build
        run: dotnet build PE-Inspector.sln -c Release --no-restore

      - name: Test
        run: dotnet test PE-Inspector.sln -c Release --no-build

  publish_release:
    runs-on: ubuntu-latest
    needs: build_test
    permissions:
      contents: write
    environment:
      name: release
    steps:
      - name: Publish Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.name || inputs.tag }}
          prerelease: ${{ inputs.prerelease == 'true' }}
          generate_release_notes: true
