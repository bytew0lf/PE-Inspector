name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore PE-Inspector.sln

      - name: Build
        run: dotnet build PE-Inspector.sln -c Release --no-restore

      - name: Test
        run: dotnet test PE-Inspector.sln -c Release --no-build
